<!DOCTYPE html>

for(let i=40;i<=100;i++){
  questions.push({
    q:`${i}. Trainer behavior scenario: correct enforcement action?`,
    o:[
      "Explain clinical reasoning",
      "Allow discussion",
      "Enforce first safety action only",
      "Compare options"
    ],
    a:2,
    auto:(i%9===0),
    r:"Trainer must enforce immediate, binary safety logic."
  });
}

const exam=document.getElementById("exam");
questions.forEach((q,i)=>{
  exam.innerHTML+=`
  <div class="question" id="qblock${i}">
    <b>${q.q} ${q.auto?'<span class="auto">(AUTO-FAIL)</span>':''}</b><br>
    ${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label><br>`).join("")}
  </div>`;
});

function submitExam(){
  const name=document.getElementById("name").value.trim();
  if(!name){alert("Enter trainer name");return;}

  let correct=0,autoFail=false;
  let reviewHTML="<h2>Item Review & Rationale</h2>";

  questions.forEach((q,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    const block=document.getElementById(`qblock${i}`);
    let status,chosen;

    if(selected){
      chosen=parseInt(selected.value);
      if(chosen===q.a){
        correct++;
        status="<span class='correct'>Correct</span>";
      } else {
        status="<span class='incorrect'>Incorrect</span>";
        if(q.auto) autoFail=true;
      }
    } else {
      status="<span class='incorrect'>Not Answered</span>";
      if(q.auto) autoFail=true;
    }

    reviewHTML+=`
      <div class="question">
        <b>${q.q}</b><br>
        Result: ${status}<br>
        <div class="rationale"><b>Rationale:</b> ${q.r}</div>
      </div>`;
  });

  const score=correct/questions.length;
  const pass=score>=PASS_MARK && !autoFail;

  document.getElementById("result").innerHTML=`
    <div class="summary">
      <h2>FINAL RESULT: ${pass?"PASS":"FAIL"}</h2>
      <p><b>Trainer:</b> ${name}</p>
      <p><b>Score:</b> ${(score*100).toFixed(1)}%</p>
      <p><b>Auto-Fail Triggered:</b> ${autoFail?"YES":"NO"}</p>
    </div>`;
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("review").innerHTML=reviewHTML;
  document.getElementById("review").classList.remove("hidden");

  if(pass){
    document.getElementById("cert").innerHTML=`
      <div class="certificate">
        <h2>CERTIFICATE OF COMPLETION</h2>
        <h1>${name}</h1>
        <p>Has successfully passed the</p>
        <h3>SCFHS Prometric Trainer Certification</h3>
        <p>Validity: 6 Months</p>
      </div>`;
    document.getElementById("cert").classList.remove("hidden");
  }
}
</script>
</body>
</html>
