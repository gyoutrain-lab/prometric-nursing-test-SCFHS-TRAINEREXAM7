<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCFHS Trainer Certification Exam – Items 26–50</title>
<style>
body {font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px;}
.container {max-width: 1100px; margin: auto; background: #fff; padding: 25px; border-radius: 8px;}
.question {border:1px solid #ccc; padding:15px; margin-bottom:12px;}
.auto {color:#b30000; font-weight:bold;}
.correct {color:green; font-weight:bold;}
.incorrect {color:#b30000; font-weight:bold;}
.rationale {margin-top:8px; font-style:italic;}
button {padding:15px 30px; font-size:16px;}
.hidden {display:none;}
.summary {background:#eef; padding:15px; margin-top:20px;}
</style>
</head>
<body>
<div class="container">
<h1>SCFHS Trainer Certification Exam</h1>
<h3>Prometric Conversion Program — Items 26–50</h3>

<label><b>Trainer Full Name</b></label>
<input id="name" style="width:100%; padding:10px; font-size:16px;"><br><br>

<form id="exam"></form>

<button onclick="submitExam()">SUBMIT EXAM</button>

<div id="result" class="hidden"></div>
<div id="review" class="hidden"></div>
</div>

<script>
const PASS_MARK = 0.85;

const questions = [
{q:"26. During a safety drill, a student suggests calling the physician first. Trainer must respond:",
o:["Allow discussion","Explain ABC priority","Agree if logic is sound","Debate the scenario"],
a:1, auto:true, r:"Immediate ABC safety actions must be prioritized; physician notification is secondary."},

{q:"27. Trainer allows >10 seconds thinking before airway assessment. This is:",
o:["Supportive","Timing violation","Encouraging deliberation","Acceptable delay"],
a:1, auto:true, r:"Prometric enforces rapid first-action decisions."},

{q:"28. Trainer explains a wrong option using grammar cues. This is:",
o:["ESL support","AUTO-FAIL","Valid teaching","Helpful context"],
a:1, auto:true, r:"Grammar-based reasoning is prohibited; it teaches guessing."},

{q:"29. Which explanation aligns with Prometric logic?",
o:["Explain pathophysiology","Focus on first safe action","Reference clinical experience","Discuss alternatives"],
a:1, auto:false, r:"Only immediate safety-action reasoning is permitted."},

{q:"30. Allowing conditional answers (“if patient stable”) is:",
o:["Acceptable clinical nuance","AUTO-FAIL","Helpful guidance","Encouraged"],
a:1, auto:true, r:"Binary safety logic forbids conditional reasoning."},

{q:"31. Trainer praises reasoning but answer is wrong. Result:",
o:["Encourages thinking","Score inflation risk","No effect","Deeper understanding"],
a:1, auto:false, r:"Correctness must align with logic; praising wrong answers inflates scores."},

{q:"32. Trainer allows students to justify unsafe options. This is:",
o:["Promotes critical thinking","Authority failure","Harmless","Minor issue"],
a:1, auto:true, r:"Negotiation erodes exam authority; unsafe answers cannot be justified."},

{q:"33. Trainer explains distractors in detail. This is:",
o:["Insightful","Unsafe coaching","Allowed","Helpful"],
a:1, auto:false, r:"Explaining distractors trains test-taking strategies."},

{q:"34. Which is correct trainer identity during drills?",
o:["Mentor","Prometric proxy","Clinical storyteller","NCLEX guide"],
a:1, auto:false, r:"Trainer functions as exam proxy, not clinical storyteller."},

{q:"35. Explaining why an answer ‘sounds urgent’ is:",
o:["Valid","AUTO-FAIL","Helpful","Allowed"],
a:1, auto:true, r:"Grammar or phrasing-based logic is prohibited."},

{q:"36. Trainer references NCLEX or STR workflow. This is:",
o:["Contextual support","AUTO-FAIL","Allowed","Helpful analogy"],
a:1, auto:true, r:"Prometric trainers cannot teach NCLEX logic; it contaminates behavior."},

{q:"37. Delaying answer to 'teach more' is:",
o:["Helpful","Unsafe","Encouraged","Optional"],
a:1, auto:false, r:"Brief rationale is permitted; delays risk drift."},

{q:"38. Partial credit or rounding answers is:",
o:["Fair","Unsafe","Encouraged","Helpful"],
a:1, auto:false, r:"Prometric logic is binary; partial credit is not allowed."},

{q:"39. Trainer allows 'close enough' responses. This is:",
o:["Acceptable","AUTO-FAIL","Helpful","Minor"],
a:1, auto:true, r:"Binary correctness must be enforced; approximation is not allowed."},

{q:"40. Praising students for reasoning but not correctness causes:",
o:["Motivation","Score inflation","Neutral","Learning enhancement"],
a:1, auto:false, r:"Correctness is enforced; reasoning praise alone may inflate scores."},

{q:"41. Which statement triggers auto-fail?",
o:["Grammar-based justification","Safety logic enforcement","Immediate action","Correct ABC reasoning"],
a:0, auto:true, r:"Grammar or sentence-based reasoning triggers automatic fail."},

{q:"42. Ignoring ESL misinterpretation and allowing guesses is:",
o:["Acceptable","AUTO-FAIL","Minor issue","Encouraged"],
a:1, auto:true, r:"Prometric requires redirecting ESL to action, not explaining language."},

{q:"43. Trainer overrides release/block rules. This is:",
o:["Leadership","AUTO-FAIL","Correct judgment","Neutral"],
a:1, auto:true, r:"Overriding rules disqualifies trainer behavior immediately."},

{q:"44. Explaining pathophysiology instead of safety action is:",
o:["Informative","AUTO-FAIL","Helpful","Allowed"],
a:1, auto:true, r:"Excess clinical explanation is forbidden; only safety action is relevant."},

{q:"45. Trainer allows discussion longer than 5 sec. This is:",
o:["Supportive","Timing violation","Helpful","Neutral"],
a:1, auto:true, r:"Excess discussion risks coaching drift; ≤5 sec enforced."},

{q:"46. Student asks 'Why not call the physician first?' Correct response:",
o:["Depends on patient","Explain ABC first","Agree if logic sound","Discuss unit policy"],
a:1, auto:false, r:"Immediate ABC safety logic must be enforced."},

{q:"47. Keyword memorization coaching is:",
o:["Helpful","SMART","AUTO-FAIL","Allowed"],
a:2, auto:true, r:"Memorization bypasses Prometric decision logic."},

{q:"48. Using personal clinical stories to justify answers is:",
o:["Illustrative","Unsafe","AUTO-FAIL","Helpful context"],
a:2, auto:true, r:"Clinical anecdotes contaminate exam logic."},

{q:"49. Celebrating high pass rate without audit:",
o:["Positive","Analytics failure","Neutral","Encouraging"],
a:1, auto:false, r:"Dashboard analysis is required; high pass may mask drift."},

{q:"50. Trainer identity best aligned with Prometric:",
o:["Exam proxy","Clinical mentor","Content expert","Motivational speaker"],
a:0, auto:false, r:"Trainer acts as a proxy enforcing exam behavior, not teaching content."}
];

const exam = document.getElementById("exam");
questions.forEach((q,i)=>{
  exam.innerHTML += `
  <div class="question" id="q${i}">
    <b>${q.q} ${q.auto?'<span class="auto">(AUTO-FAIL)</span>':''}</b><br>
    ${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label><br>`).join("")}
  </div>`;
});

function submitExam(){
  const name = document.getElementById("name").value.trim();
  if(!name){alert("Enter trainer name"); return;}

  let correct = 0;
  let autoFail = false;
  let reviewHTML = "<h2>Item Review & Rationale</h2>";

  questions.forEach((q,i)=>{
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    let status = "<span class='incorrect'>Incorrect</span>";
    if(selected && parseInt(selected.value) === q.a){
      correct++;
      status = "<span class='correct'>Correct</span>";
    } else if(q.auto){
      autoFail = true;
    }
    reviewHTML += `
    <div class="question">
      <b>${q.q}</b><br>
      Result: ${status}<br>
      <div class="rationale"><b>Rationale:</b> ${q.r}</div>
    </div>`;
  });

  const score = correct / questions.length;
  const pass = score >= PASS_MARK && !autoFail;

  document.getElementById("result").innerHTML = `
    <div class="summary">
      <h2>FINAL RESULT: ${pass ? "PASS" : "FAIL"}</h2>
      <p><b>Trainer:</b> ${name}</p>
      <p><b>Score:</b> ${(score*100).toFixed(1)}%</p>
      <p><b>Auto-Fail Triggered:</b> ${autoFail ? "YES" : "NO"}</p>
    </div>`;
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("review").innerHTML = reviewHTML;
  document.getElementById("review").classList.remove("hidden");
}
</script>
</body>
</html>
