<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SCFHS Trainer Certification Exam – Items 26–50</title>
<style>
body {font-family: Arial, sans-serif; background: #f4f6f8; padding: 20px;}
.container {max-width: 1100px; margin: auto; background: #fff; padding: 25px; border-radius: 8px;}
.question {border:1px solid #ccc; padding:15px; margin-bottom:12px;}
.auto {color:#b30000; font-weight:bold;}
.correct {color:green; font-weight:bold;}
.incorrect {color:#b30000; font-weight:bold;}
.rationale {margin-top:8px; font-style:italic;}
button {padding:15px 30px; font-size:16px;}
.hidden {display:none;}
.summary {background:#eef; padding:15px; margin-top:20px;}
</style>
</head>
<body>
<div class="container">
<h1>SCFHS Trainer Certification Exam</h1>
<h3>Prometric Conversion Program — Items 1–100</h3>

<label><b>Trainer Full Name</b></label>
<input id="name" style="width:100%; padding:10px; font-size:16px;"><br><br>

<form id="exam"></form>

<button onclick="submitExam()">SUBMIT EXAM</button>

<div id="result" class="hidden"></div>
<div id="review" class="hidden"></div>
</div>

<script>
const PASS_MARK = 0.85;

const questions = [
{q:"1. During a drill, a student asks why oxygen is correct when SpO₂ is 84%. Which explanation is permitted?",
o:["Because hypoxia causes cellular damage","Because ABC priority requires immediate airway and breathing action","Because wording suggests urgency","Because oxygen improves oxygen saturation values"],
a:1, auto:true, r:"Only ABC-based safety logic is permitted. Grammar, physiology, or outcome-based explanations are forbidden."},

{q:"2. Which trainer statement demonstrates correct Prometric thinking?",
o:["Which option treats the underlying cause?","Which action would you do in real practice?","Which option removes immediate safety risk first?","Which answer sounds most urgent?"],
a:2, auto:false, r:"Prometric logic prioritizes immediate risk elimination, not causes or realism."},

{q:"3. A trainer tells students, 'In real life, nurses often do this first.' This behavior is:",
o:["Acceptable contextualization","Helpful professional insight","A violation of exam authority","Encouraging confidence"],
a:2, auto:true, r:"Personal or real-life framing replaces exam logic with clinical authority."},

{q:"4. Which reasoning must NEVER be accepted as correct?",
o:["This delays immediate intervention","This violates ABC priority","This option is unsafe as a first action","This sentence tense implies urgency"],
a:3, auto:true, r:"Grammar- or wording-based reasoning trains guessing behavior and invalidates the exam."},

{q:"5. The trainer’s primary role during drills is to:",
o:["Improve student understanding","Build clinical confidence","Enforce exam-safe decision behavior","Explain professional practice"],
a:2, auto:false, r:"Trainers function as Prometric proxies, not educators."},

{q:"6. Why are rationales restricted to very short statements?",
o:["To save time","To reduce cognitive load","To prevent unsafe explanatory drift","To match screen layout"],
a:2, auto:false, r:"Long explanations invite NCLEX-style reasoning and coaching."},

{q:"7. A trainer praises a student’s reasoning even though the answer is wrong. This causes:",
o:["Motivation","Deeper learning","Score inflation risk","No effect"],
a:2, auto:false, r:"Correctness must align with correct logic; praising wrong answers inflates scores."},

{q:"8. Which explanation is strictly forbidden?",
o:["This is not the first action","This delays care","This exceeds nursing scope","This option sounds less urgent"],
a:3, auto:true, r:"Urgency inferred from language cues is prohibited."},

{q:"9. Allowing students to explain why distractors are tempting is:",
o:["Insightful","Advanced teaching","Unsafe coaching","Encouraging analysis"],
a:2, auto:false, r:"Explaining distractors trains test-taking tricks."},

{q:"10. Which phrase must be corrected immediately if used by a trainer?",
o:["Immediate safety action","Violates ABC","It depends on the situation","First nursing action"],
a:2, auto:true, r:"Conditional logic is incompatible with Prometric safety decisions."},

{q:"11. A trainer allows open discussion before answering an airway question. This is:",
o:["Supportive for ESL learners","Encouraging engagement","A violation of timing discipline","Acceptable if corrected later"],
a:2, auto:false, r:"Prometric enforces rapid, decisive responses."},

{q:"12. A student asks for clarification of a medical term in the stem. The trainer must:",
o:["Define the term","Rephrase the question","Redirect to action despite unclear vocabulary","Remove the item"],
a:2, auto:false, r:"Action logic supersedes vocabulary understanding."},

{q:"13. A trainer negotiates an answer because the student’s logic 'makes sense.' This is:",
o:["Adaptive teaching","Good mentorship","Authority failure","Minor deviation"],
a:2, auto:true, r:"Negotiation erodes exam authority and consistency."},

{q:"14. Which trainer behavior preserves exam validity?",
o:["Allowing debate","Providing hints","Enforcing immediate selection","Explaining reasoning afterward"],
a:2, auto:false, r:"Immediate enforcement prevents coaching drift."},

{q:"15. A trainer states, 'Doctors usually want this done first.' This is:",
o:["Helpful context","Policy-based guidance","Irrelevant and unsafe","Realistic teaching"],
a:2, auto:false, r:"Provider preferences are irrelevant to Prometric logic."},

{q:"16. A cohort shows a 94% pass rate with very fast response times. The correct action is to:",
o:["Celebrate success","Release the cohort","Audit trainer rationale behavior","Increase exam difficulty"],
a:2, auto:false, r:"High pass + speed often indicates coaching drift."},

{q:"17. Which dashboard metric most strongly signals score inflation?",
o:["Low ESL error rate","High pass rate alone","High pass rate with compressed response time","High item difficulty"],
a:2, auto:false, r:"Speed + accuracy suggests coached patterns."},

{q:"18. A trainer overrides release rules due to confidence in the cohort. This results in:",
o:["Leadership credit","Professional judgment","Automatic disqualification","Minor noncompliance"],
a:2, auto:true, r:"Release authority violations are non-remediable."},

{q:"19. Which statement reflects correct analytics literacy?",
o:["Students are smart","Teaching was effective","Trainer behavior requires audit","Questions were easy"],
a:2, auto:false, r:"Analytics assess trainer behavior, not student intelligence."},

{q:"20. Ignoring dashboard red flags is:",
o:["Trusting experience","Positive leadership","Governance failure","Minor oversight"],
a:2, auto:false, r:"Data blindness leads to unsafe releases."},

{q:"21. Which self-description indicates an unsafe trainer identity?",
o:["Safety gatekeeper","Exam behavior calibrator","Clinical mentor","Prometric proxy"],
a:2, auto:true, r:"Clinical mentorship contaminates exam enforcement."},

{q:"22. Teaching keyword memorization strategies is:",
o:["Efficient","Helpful for ESL","Prohibited coaching","Smart preparation"],
a:2, auto:true, r:"Memorization bypasses decision logic."},

{q:"23. Allowing 'close enough' answers is:",
o:["Encouraging","Fair","A critical violation","Supportive"],
a:2, auto:true, r:"Prometric decisions are binary."},

{q:"24. The trainer’s ultimate responsibility is to:",
o:["Help students pass","Teach content clearly","Prevent unsafe candidate release","Improve confidence"],
a:2, auto:false, r:"Gatekeeping overrides pedagogy."},

{q:"25. A trainer who explains well but releases unsafe learners is best described as:",
o:["Effective","Experienced","Dangerous","Successful"],
a:2, auto:false, r:"Clear explanation does not compensate for unsafe release."},

{q:"26. During a safety drill, a student suggests calling the physician first. Trainer must respond:",
o:["Allow discussion","Explain ABC priority","Agree if logic is sound","Debate the scenario"],
a:1, auto:true, r:"Immediate ABC safety actions must be prioritized; physician notification is secondary."},

{q:"27. Trainer allows >10 seconds thinking before airway assessment. This is:",
o:["Supportive","Timing violation","Encouraging deliberation","Acceptable delay"],
a:1, auto:true, r:"Prometric enforces rapid first-action decisions."},

{q:"28. Trainer explains a wrong option using grammar cues. This is:",
o:["ESL support","AUTO-FAIL","Valid teaching","Helpful context"],
a:1, auto:true, r:"Grammar-based reasoning is prohibited; it teaches guessing."},

{q:"29. Which explanation aligns with Prometric logic?",
o:["Explain pathophysiology","Focus on first safe action","Reference clinical experience","Discuss alternatives"],
a:1, auto:false, r:"Only immediate safety-action reasoning is permitted."},

{q:"30. Allowing conditional answers (“if patient stable”) is:",
o:["Acceptable clinical nuance","AUTO-FAIL","Helpful guidance","Encouraged"],
a:1, auto:true, r:"Binary safety logic forbids conditional reasoning."},

{q:"31. Trainer praises reasoning but answer is wrong. Result:",
o:["Encourages thinking","Score inflation risk","No effect","Deeper understanding"],
a:1, auto:false, r:"Correctness must align with logic; praising wrong answers inflates scores."},

{q:"32. Trainer allows students to justify unsafe options. This is:",
o:["Promotes critical thinking","Authority failure","Harmless","Minor issue"],
a:1, auto:true, r:"Negotiation erodes exam authority; unsafe answers cannot be justified."},

{q:"33. Trainer explains distractors in detail. This is:",
o:["Insightful","Unsafe coaching","Allowed","Helpful"],
a:1, auto:false, r:"Explaining distractors trains test-taking strategies."},

{q:"34. Which is correct trainer identity during drills?",
o:["Mentor","Prometric proxy","Clinical storyteller","NCLEX guide"],
a:1, auto:false, r:"Trainer functions as exam proxy, not clinical storyteller."},

{q:"35. Explaining why an answer ‘sounds urgent’ is:",
o:["Valid","AUTO-FAIL","Helpful","Allowed"],
a:1, auto:true, r:"Grammar or phrasing-based logic is prohibited."},

{q:"36. Trainer references NCLEX or STR workflow. This is:",
o:["Contextual support","AUTO-FAIL","Allowed","Helpful analogy"],
a:1, auto:true, r:"Prometric trainers cannot teach NCLEX logic; it contaminates behavior."},

{q:"37. Delaying answer to 'teach more' is:",
o:["Helpful","Unsafe","Encouraged","Optional"],
a:1, auto:false, r:"Brief rationale is permitted; delays risk drift."},

{q:"38. Partial credit or rounding answers is:",
o:["Fair","Unsafe","Encouraged","Helpful"],
a:1, auto:false, r:"Prometric logic is binary; partial credit is not allowed."},

{q:"39. Trainer allows 'close enough' responses. This is:",
o:["Acceptable","AUTO-FAIL","Helpful","Minor"],
a:1, auto:true, r:"Binary correctness must be enforced; approximation is not allowed."},

{q:"40. Praising students for reasoning but not correctness causes:",
o:["Motivation","Score inflation","Neutral","Learning enhancement"],
a:1, auto:false, r:"Correctness is enforced; reasoning praise alone may inflate scores."},

{q:"41. Which statement triggers auto-fail?",
o:["Grammar-based justification","Safety logic enforcement","Immediate action","Correct ABC reasoning"],
a:0, auto:true, r:"Grammar or sentence-based reasoning triggers automatic fail."},

{q:"42. Ignoring ESL misinterpretation and allowing guesses is:",
o:["Acceptable","AUTO-FAIL","Minor issue","Encouraged"],
a:1, auto:true, r:"Prometric requires redirecting ESL to action, not explaining language."},

{q:"43. Trainer overrides release/block rules. This is:",
o:["Leadership","AUTO-FAIL","Correct judgment","Neutral"],
a:1, auto:true, r:"Overriding rules disqualifies trainer behavior immediately."},

{q:"44. Explaining pathophysiology instead of safety action is:",
o:["Informative","AUTO-FAIL","Helpful","Allowed"],
a:1, auto:true, r:"Excess clinical explanation is forbidden; only safety action is relevant."},

{q:"45. Trainer allows discussion longer than 5 sec. This is:",
o:["Supportive","Timing violation","Helpful","Neutral"],
a:1, auto:true, r:"Excess discussion risks coaching drift; ≤5 sec enforced."},

{q:"46. Student asks 'Why not call the physician first?' Correct response:",
o:["Depends on patient","Explain ABC first","Agree if logic sound","Discuss unit policy"],
a:1, auto:false, r:"Immediate ABC safety logic must be enforced."},

{q:"47. Keyword memorization coaching is:",
o:["Helpful","SMART","AUTO-FAIL","Allowed"],
a:2, auto:true, r:"Memorization bypasses Prometric decision logic."},

{q:"48. Using personal clinical stories to justify answers is:",
o:["Illustrative","Unsafe","AUTO-FAIL","Helpful context"],
a:2, auto:true, r:"Clinical anecdotes contaminate exam logic."},

{q:"49. Celebrating high pass rate without audit:",
o:["Positive","Analytics failure","Neutral","Encouraging"],
a:1, auto:false, r:"Dashboard analysis is required; high pass may mask drift."},

{q:"50. Trainer identity best aligned with Prometric:",
o:["Exam proxy","Clinical mentor","Content expert","Motivational speaker"],
a:0, auto:false, r:"Trainer acts as a proxy enforcing exam behavior, not teaching content."}
];

const exam = document.getElementById("exam");
questions.forEach((q,i)=>{
  exam.innerHTML += `
  <div class="question" id="q${i}">
    <b>${q.q} ${q.auto?'<span class="auto">(AUTO-FAIL)</span>':''}</b><br>
    ${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label><br>`).join("")}
  </div>`;
});

function submitExam(){
  const name = document.getElementById("name").value.trim();
  if(!name){alert("Enter trainer name"); return;}

  let correct = 0;
  let autoFail = false;
  let reviewHTML = "<h2>Item Review & Rationale</h2>";

  questions.forEach((q,i)=>{
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    let status = "<span class='incorrect'>Incorrect</span>";
    if(selected && parseInt(selected.value) === q.a){
      correct++;
      status = "<span class='correct'>Correct</span>";
    } else if(q.auto){
      autoFail = true;
    }
    reviewHTML += `
    <div class="question">
      <b>${q.q}</b><br>
      Result: ${status}<br>
      <div class="rationale"><b>Rationale:</b> ${q.r}</div>
    </div>`;
  });

  const score = correct / questions.length;
  const pass = score >= PASS_MARK && !autoFail;

  document.getElementById("result").innerHTML = `
    <div class="summary">
      <h2>FINAL RESULT: ${pass ? "PASS" : "FAIL"}</h2>
      <p><b>Trainer:</b> ${name}</p>
      <p><b>Score:</b> ${(score*100).toFixed(1)}%</p>
      <p><b>Auto-Fail Triggered:</b> ${autoFail ? "YES" : "NO"}</p>
    </div>`;
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("review").innerHTML = reviewHTML;
  document.getElementById("review").classList.remove("hidden");
}
</script>
</body>
</html>
